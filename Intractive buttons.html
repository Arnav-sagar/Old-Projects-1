<!DOCTYPE html>
<html>
<head>
	<title>Some Works</title>
	<style type="text/css">
		*{
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'poppins', sans-serif;
}
body
{
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	flex-direction: column;
	gap: 50px;
}
a
{
	position: relative;
	background: #fff;
	color: #fff;
	text-decoration: none;
	text-transform: uppercase;
	font-size: 1.5em;
	letter-spacing: 0.1em;
	font-weight: 400;
	padding: 20px 50px;
	transition: 0.5s;
}
a:hover
{
	background: var(--clr);
	color: var(--clr);
	letter-spacing: 0.30em;
	box-shadow: 0 0 35px var(--clr);
}
a:before
{
	content: '';
	position: absolute;
	inset: 2px;
	background: #000000e0;
}
a span
{
	position: relative;
	z-index: 1;    
}
a i
{
	position: absolute;
	inset: 0;
	display: block;
}
a i::before
{
	content: '';
	position: absolute;
	top: 0;
	left: 80%;
	width: 10px;
	height: 4px;
	background: #000000e0;
	transition: translateX(-50%) skewX(135deg);
	transition: 0.5s;
}
a:hover i::before
{
	width: 20px;
	left: 20%;
}


a i::after
{
	content: '';
	position: absolute;
	bottom: 0;
	left: 20%;
	width: 10px;
	height: 4px;
	background: #000000e0;
	transition: translateX(-50%) skewX(325deg);
	transition: 0.5s;
}
a:hover i::after
{
	width: 20px;
	left: 80%;
}
		body{background-color: #000000e0}
	</style>
	
</head>
<body>
</a>
<a href="#" style="--clr:#6eff3e">
	<span>Learn N Grow</span><i></i>
</a>
<a href="#" style="--clr:#d6d6d6e0">
	<span>Edify</span><i></i>
</a>
<a href="#" style="--clr:#ff9800">
	<span>Button 3</span><i></i>
</a>
<a href="#" style="--clr:#1e9bff">
	<span>Button 4</span><i></i>
	</a>
</body>
</html>
